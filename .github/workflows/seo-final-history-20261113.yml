name: Record TruTool final meta description revisions
on:
  push:
    branches:
      - fix/trutool-research-evidence-indexability-20261113
    paths:
      - .github/workflows/seo-final-history-20261113.yml
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Update actual changed editorial page fingerprints
        run: node scripts/generate-content-history.mjs --write --date 2026-11-13T10:39:00Z
      - name: Commit date changes
        run: |
          if git diff --quiet -- lib/content-history.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/content-history.json
          git commit -m "Record final alternatives metadata revision history"
          git push origin HEAD:fix/trutool-research-evidence-indexability-20261113
