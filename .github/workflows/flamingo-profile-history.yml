name: Record 4 November AI video profile SEO history
on:
  push:
    branches:
      - feature/flamingo-float-ai-20261104
    paths:
      - .github/workflows/flamingo-profile-history.yml
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate accurate content history for new profile and affected pages
        run: node scripts/generate-content-history.mjs --write --date 2026-11-04T09:00:00Z
      - name: Emit the computed history differences for authorized release
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const before=JSON.parse(execFileSync('git',['show','HEAD:lib/content-history.json'],{encoding:'utf8'}));
          const after=JSON.parse(fs.readFileSync('lib/content-history.json','utf8'));
          const updated=Object.fromEntries(Object.entries(after).filter(([key,record])=>JSON.stringify(record)!==JSON.stringify(before[key])));
          const removed=Object.keys(before).filter(key=>!Object.hasOwn(after,key));
          console.log('TRUTOOL_HISTORY_PATCH_V1:'+JSON.stringify({updated,removed}));
          console.log('SEO HISTORY CHANGES:',Object.keys(updated).length,'updated,',removed.length,'removed');
          NODE
