name: TruTool SEO content history commit
on:
  push:
    branches:
      - seo/unique-alternatives-site-index-20261113
    paths:
      - .github/workflows/seo-content-history-20261113.yml
permissions:
  contents: write
jobs:
  update-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Recompute only genuinely changed canonical page fingerprints
        run: node scripts/generate-content-history.mjs --write --date 2026-11-13T09:42:17Z
      - name: Commit audited revision history
        run: |
          if git diff --quiet -- lib/content-history.json; then
            echo "Content dates already accurate"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/content-history.json
          git commit -m "Record verified TruTool SEO content revision history"
          git push origin HEAD:seo/unique-alternatives-site-index-20261113
