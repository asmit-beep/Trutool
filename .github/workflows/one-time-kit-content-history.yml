name: Record TruTool duplicate consolidation revisions
on:
  push:
    branches:
      - fix/trutool-identical-kit-pages-20261113
    paths:
      - .github/workflows/one-time-kit-content-history.yml
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/generate-content-history.mjs --write --date 2026-11-13T09:58:00Z
      - name: Commit only changed date records
        run: |
          if git diff --quiet -- lib/content-history.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/content-history.json
          git commit -m "Track canonical Kit consolidation dates"
          git push origin HEAD:fix/trutool-identical-kit-pages-20261113
