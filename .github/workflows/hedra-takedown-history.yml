name: One-time removed-vendor content revisions
on:
  push:
    branches:
      - fix/remove-hedra-20261103
    paths:
      - .github/workflows/hedra-takedown-history.yml
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate affected editorial content timestamps
        run: node scripts/generate-content-history.mjs --write --date 2026-11-03T02:00:00Z
      - name: Commit regenerated history only
        run: |
          if git diff --quiet -- lib/content-history.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/content-history.json
          git commit -m "Record canonical updates after requested vendor removal"
          git push origin HEAD:fix/remove-hedra-20261103
